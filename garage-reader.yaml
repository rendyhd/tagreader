# LOLIN D1 mini + the photographed 12V Wiegand reader.
# IMPORTANT: D0/D1 go through the INVERTING NPN input circuits in the guide.
# Copy garage-secrets.example.yaml to secrets.yaml and generate your own keys.
substitutions:
  name: garage-card-reader
  friendly_name: Garage Card Reader
  card_quiet_ms: "2500"
  scan_cooldown_ms: "2000"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.2
  project:
    name: rendyhd.garage_card_reader
    version: "1.0.0"
  includes:
    - garage_reader.h

esp8266:
  board: d1_mini
  framework:
    version: 3.1.2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 15min

logger:
  level: INFO
  # Wiegand's DEBUG log prints IDs; use DEBUG only when commissioning.

api:
  id: garage_api
  encryption:
    key: !secret garage_reader_api_key
  batch_delay: 0ms
  max_connections: 3
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret garage_reader_ota_password

globals:
  - id: frame_bits
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: scan_tag
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: forward_scan
    type: bool
    restore_value: false
    initial_value: "false"

interval:
  - interval: 100ms
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - lambda: garage_reader::gate().connection(true, millis());
          else:
            - lambda: garage_reader::gate().connection(false, millis());

wiegand:
  - id: gate_wiegand
    d0:
      number: D1  # GPIO5; reader GREEN D0 via Q1 collector
      mode: INPUT
      inverted: true  # Required: one NPN inverter per data line
    d1:
      number: D2  # GPIO4; reader WHITE D1 via Q2 collector
      mode: INPUT
      inverted: true
    on_raw:
      # Diagnostics only: raw frames have not passed parity checks.
      - lambda: |-
          id(frame_bits) = bits;
          id(last_frame_bits).publish_state(bits);
    on_tag:
      # ESPHome on_tag accepts parity-valid WG26/WG34 frames only.
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - lambda: garage_reader::gate().connection(true, millis());
          else:
            - lambda: garage_reader::gate().connection(false, millis());
      - lambda: |-
          id(forward_scan) = false;
          if (id(frame_bits) != 26 && id(frame_bits) != 34) return;
          id(scan_tag) = "wg" + std::to_string(id(frame_bits)) + "-" + x;
          id(last_card).publish_state(id(scan_tag));
          const uint32_t now = millis();
          id(forward_scan) = garage_reader::gate().scan(
              id(scan_tag), now, ${card_quiet_ms}, ${scan_cooldown_ms});
      - if:
          condition:
            lambda: return id(forward_scan);
          then:
            # HA auto-discovers scanned IDs under Settings > Tags.
            # A new tag grants NO permissions until an automation is assigned.
            - homeassistant.tag_scanned: !lambda return id(scan_tag);

text_sensor:
  - platform: template
    id: last_card
    name: Last Card
    icon: mdi:card-account-details
    entity_category: diagnostic
    update_interval: never
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Online
  - platform: template
    name: Ready for Cards
    entity_category: diagnostic
    lambda: return garage_reader::gate().ready(millis());

sensor:
  - platform: template
    id: last_frame_bits
    name: Last Frame Bits
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
  - platform: wifi_signal
    name: WiFi Signal
    entity_category: diagnostic
    update_interval: 60s
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
    update_interval: 60s

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
