name: Movie Time checks

on:
  # Feature branches are checked through their pull request, not twice.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movie-time-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    name: Reader state and parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - run: g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/test_reader.cpp -o /tmp/test-reader
      - run: /tmp/test-reader

  firmware:
    name: ESPHome 2026.8.2 / original D1 mini
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install esphome==2026.8.2
      - run: python tests/prepare_compile.py
      - run: esphome compile .test-build/movie-player.yaml
      # The compiled test binary contains dummy credentials and is not distributed.

  home-assistant:
    name: Home Assistant ${{ matrix.version }} / Kodi automation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['2026.8.0', '2026.9.1']
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt homeassistant==${{ matrix.version }}
      - run: python -m pytest -q tests/test_home_assistant.py

  # The release workflow (publish.yml) still builds the original firmware.
  legacy-firmware:
    name: Original tagreader.yaml / ESPHome ${{ matrix.esphome-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        esphome-version: [stable, beta, dev]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: esphome/build-action@v6.0.0
        with:
          yaml-file: tagreader.yaml
          version: ${{ matrix.esphome-version }}
