<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120">
<style>text{font-family:Arial,sans-serif;fill:#162838} .title{font-size:30px;font-weight:bold}.h{font-size:21px;font-weight:bold}.t{font-size:18px}.small{font-size:16px}.wire{fill:none;stroke:#354e60;stroke-width:3}.box{fill:#eef5fa;stroke:#bed0dc;stroke-width:2}.dot{fill:#354e60}.power{fill:none;stroke:#cc4939;stroke-width:3}</style>
<rect width="1280" height="1120" fill="white"/>
<text x="40" y="48" class="title">Garage card reader • LOLIN D1 mini + 12 V Wiegand</text>
<text x="40" y="78" class="t">Board D1 / D2 are GPIO5 / GPIO4. Reader D0 / D1 are signal names.</text>
<rect x="40" y="105" width="1200" height="55" rx="8" fill="#fff2df"/>
<text x="60" y="140" class="h">Use BOTH input stages below. Never connect 12 V or reader data directly to GPIO.</text>
<rect x="50" y="195" width="240" height="180" rx="10" class="box"/>
<text x="70" y="230" class="h">Regulated 12 V DC</text>
<text x="70" y="265" class="t">+12 V</text><text x="70" y="345" class="t">0 V / GND</text>
<rect x="470" y="190" width="310" height="190" rx="10" class="box"/>
<text x="490" y="225" class="h">Photographed reader</text>
<text x="490" y="265" class="t">RED • VCC +12 V</text>
<text x="490" y="345" class="t">BLACK • GND</text>
<path d="M290 260 H470" class="power"/><text x="325" y="247" class="small">+12 V</text>
<path d="M290 340 H470" class="wire"/>
<rect x="890" y="190" width="320" height="130" rx="10" class="box"/>
<text x="910" y="225" class="h">12 V → 5 V buck</text>
<text x="910" y="258" class="t">Set output to 5.0 V first</text>
<text x="910" y="289" class="small">5 V output rated ≥ 500 mA</text>
<path d="M365 260 V175 H1040 V190" class="power"/><circle cx="365" cy="260" r="5" fill="#cc4939"/>
<rect x="890" y="395" width="320" height="225" rx="10" class="box"/>
<text x="910" y="432" class="h">LOLIN D1 mini V4</text>
<text x="910" y="467" class="t">VBUS ← regulated 5 V only</text>
<text x="910" y="500" class="t">GND ← common ground</text>
<text x="910" y="533" class="t">3V3 → input pull-ups</text>
<text x="910" y="566" class="t">GPIO5 / D1 / printed 5 ← Q1</text>
<text x="910" y="599" class="t">GPIO4 / D2 / printed 4 ← Q2</text>
<path d="M1110 320 V395" class="power"/><text x="1125" y="365" class="small">5 V</text>
<path d="M360 340 V660 H1250 V500 H1210 M990 320 V350 H1250 V500" class="wire"/>
<circle cx="360" cy="340" r="5" class="dot"/><text x="620" y="687" class="t">COMMON GROUND: reader, buck, board, Q1/Q2 emitters</text>
<rect x="50" y="405" width="730" height="215" rx="10" class="box"/>
<text x="70" y="441" class="h">Reader wire mapping</text>
<text x="70" y="480" class="t" fill="#23834e">GREEN D0 → Q1 input → GPIO5 / board D1</text>
<text x="70" y="517" class="t">WHITE D1 → Q2 input → GPIO4 / board D2</text>
<text x="70" y="554" class="t">BROWN → GND for WG34, as stated on your sticker</text>
<text x="70" y="591" class="t">BLUE LED and YELLOW BEEP: insulate separately, unused</text>
<text x="50" y="733" class="h">Build this circuit twice: Q1 for GREEN D0, Q2 for WHITE D1</text>
<text x="50" y="763" class="small">One 2N3904 + 47 kΩ + 100 kΩ + two 10 kΩ + one 1N4148 per channel. Check E/B/C lead order.</text>
<!-- Input bias: diode anode at 5V, striped cathode toward resistor/data -->
<text x="105" y="812" class="t">5 V</text>
<path d="M140 821 V830 H190" class="wire"/>
<path d="M190 818 L210 830 L190 842 Z M214 817 V843" fill="none" stroke="#354e60" stroke-width="3"/>
<path d="M214 830 H250" class="wire"/>
<rect x="250" y="821" width="70" height="18" fill="white" stroke="#354e60" stroke-width="3"/>
<path d="M320 830 H360 V910" class="wire"/>
<text x="175" y="792" class="small">1N4148 • stripe →</text><text x="253" y="863" class="small">10 kΩ</text>
<text x="50" y="939" class="t">Reader DATA</text>
<path d="M180 910 H450" class="wire"/><circle cx="360" cy="910" r="5" class="dot"/>
<rect x="450" y="901" width="85" height="18" fill="white" stroke="#354e60" stroke-width="3"/>
<text x="455" y="892" class="t">47 kΩ</text>
<path d="M535 910 H680" class="wire"/><circle cx="580" cy="910" r="5" class="dot"/>
<!-- Base pulldown -->
<path d="M580 910 V945" class="wire"/><rect x="571" y="945" width="18" height="50" fill="white" stroke="#354e60" stroke-width="3"/>
<text x="595" y="977" class="t">100 kΩ</text><path d="M580 995 V1020" class="wire"/>
<!-- NPN symbol: collector top, emitter bottom, outward arrow -->
<circle cx="718" cy="910" r="48" fill="white" stroke="#354e60" stroke-width="2"/>
<path d="M680 910 H700 M700 885 V935 M700 897 L735 870 V830 M700 923 L735 952 V1020" class="wire"/>
<path d="M724 936 L735 952 L716 946" fill="#354e60"/>
<text x="775" y="915" class="h">Q1 / Q2</text><text x="775" y="944" class="t">2N3904 NPN</text>
<text x="652" y="903" class="small">B</text><text x="742" y="871" class="small">C</text><text x="742" y="991" class="small">E</text>
<path d="M735 830 H1040" class="wire"/>
<text x="855" y="857" class="t">GPIO5 (Q1) or GPIO4 (Q2)</text>
<circle cx="835" cy="830" r="5" class="dot"/>
<path d="M835 830 V795 H865" class="wire"/><rect x="865" y="786" width="75" height="18" fill="white" stroke="#354e60" stroke-width="3"/>
<path d="M940 795 H1005" class="wire"/><text x="1015" y="800" class="t">board 3V3</text><text x="876" y="779" class="small">10 kΩ</text>
<path d="M580 1020 H735 M658 1020 V1033 M636 1033 H680 M643 1041 H673 M651 1049 H665" class="wire"/>
<circle cx="735" cy="1020" r="5" class="dot"/><text x="760" y="1032" class="t">common GND</text>
<text x="50" y="1083" class="t">NPN inputs invert pulses: firmware uses inverted: true. Disconnect external VBUS 5 V during USB flashing.</text>
</svg>
